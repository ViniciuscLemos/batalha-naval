name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: javac -encoding UTF-8 -Xlint:all -Werror -d out $(find src -name "*.java")
      - name: Tests
        run: java -cp out battleship.BattleshipTest
