name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: javac -encoding UTF-8 -Xlint:all -Werror -d out $(find src -name "*.java")
      - name: Testes
        run: java -cp out batalhanaval.BatalhaNavalTest
